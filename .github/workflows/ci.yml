name: Canglian ERP CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canglian
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Maven Unit Tests & Package
        run: mvn test package -DskipITs

  frontend-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canglian-vue3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: canglian-vue3/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Frontend Unit Tests
        run: npm test
      - name: Production Build
        run: npm run build:prod
